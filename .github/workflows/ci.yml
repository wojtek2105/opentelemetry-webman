name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: opentelemetry, swoole
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict --no-check-publish
      - run: composer test
      - run: composer analyse

  coding-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: opentelemetry, swoole
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist
      - run: composer cs-check
